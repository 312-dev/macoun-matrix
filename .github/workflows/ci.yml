name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests (no Rust library)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libolm-dev
      # These packages do not link librustpushgo, so they need no rustpush checkout.
      - run: go vet ./imessage/... ./ipc/... ./pkg/cli/... ./pkg/bbctl/... ./pkg/dbowner/...
      - run: go test ./imessage/... ./ipc/... ./pkg/cli/... ./pkg/bbctl/... ./pkg/dbowner/...

  relay:
    name: Relay and extract-key build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/macoun-relay/go.mod
      - run: go build -o /tmp/nac-relay ./tools/nac-relay
        working-directory: tools/macoun-relay
      - run: go build -o /tmp/extract-key .
        working-directory: tools/extract-key

  bridge:
    name: Bridge build and tests (Linux amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: macoun-matrix
      - name: Check out rustpush at the pinned commit
        run: |
          git clone https://github.com/OpenBubbles/rustpush.git rustpush
          git -C rustpush checkout "$(cat macoun-matrix/third_party/rustpush-upstream.sha)"
          git -C rustpush -c url.https://github.com/.insteadOf=git@github.com: \
            submodule update --init --recursive
      - uses: actions/cache@v4
        with:
          path: |
            cache/cargo-registry
            cache/go-mod
          key: bridge-deps-${{ hashFiles('macoun-matrix/pkg/rustpushgo/Cargo.lock', 'macoun-matrix/go.sum', 'macoun-matrix/third_party/rustpush-upstream.sha') }}
      - name: Build the build image
        run: docker build -t macoun-build:local macoun-matrix/docker -f macoun-matrix/docker/Dockerfile.build
      - name: Build and test
        run: |
          mkdir -p cache/cargo-registry cache/go-mod
          docker run --rm \
            -v "$PWD/macoun-matrix:/src" -v "$PWD/rustpush:/rustpush:ro" \
            -v "$PWD/cache/cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/cache/go-mod:/root/go/pkg/mod" \
            macoun-build:local bash -c '
              set -e
              git config --global --add safe.directory "*"
              scripts/macoun-build-linux.sh test
              scripts/macoun-build-linux.sh build'
